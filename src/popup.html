<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>網站伺服器與後端漏洞檢測器</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --info: #3b82f6;
      --info-bg: rgba(59, 130, 246, 0.15);
      --accent: #ef4444; /* Default brand theme color: Alert Red */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 420px;
      max-height: 600px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 14px;
      font-size: 13px;
      line-height: 1.45;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      font-size: 20px;
    }

    h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge-ver {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      background: #ef4444;
      color: #ffffff;
      font-weight: 700;
    }

    .auto-alert-notice {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #fca5a5;
      display: none;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.8; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .url-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .url-text {
      font-weight: 600;
      font-size: 13px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Status Banner */
    .status-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    .status-banner.CRITICAL {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .status-banner.HIGH {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
    }
    .status-banner.WARNING {
      background: var(--warning-bg);
      border: 1px solid var(--warning);
      color: #fcd34d;
    }
    .status-banner.INFO {
      background: var(--info-bg);
      border: 1px solid var(--info);
      color: #93c5fd;
    }
    .status-banner.SAFE {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #6ee7b7;
    }
    .status-banner.NONE {
      background: #1e293b;
      border: 1px solid #475569;
      color: var(--text-muted);
    }

    /* Tech Stack Chips */
    .tech-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tech-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .tech-chip.vulnerable {
      border-color: var(--danger);
      color: #f87171;
      background: var(--danger-bg);
    }

    /* Section Header */
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .count-chip {
      background: #334155;
      color: #cbd5e1;
      padding: 1px 7px;
      border-radius: 12px;
      font-size: 11px;
    }

    /* CVE Card */
    .cve-card {
      background: #182234;
      border: 1px solid #334155;
      border-left: 4px solid var(--danger);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .cve-card.HIGH {
      border-left-color: #ea580c;
    }
    .cve-card.MEDIUM {
      border-left-color: var(--warning);
    }

    .cve-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .cve-id-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cve-tech-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      background: #334155;
      color: #94a3b8;
    }

    .cve-id {
      font-weight: 700;
      color: #f8fafc;
      font-size: 13px;
    }

    .cvss-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--danger-bg);
      color: #f87171;
    }
    .cvss-tag.HIGH {
      background: rgba(234, 88, 12, 0.15);
      color: #fb923c;
    }
    .cvss-tag.MEDIUM {
      background: var(--warning-bg);
      color: #fde047;
    }

    .cve-name {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .cve-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .cve-remedy {
      background: #0f172a;
      border-radius: 4px;
      padding: 8px;
      font-size: 11px;
      color: #a5f3fc;
      margin-top: 6px;
      border: 1px solid #1e293b;
    }
    .cve-remedy-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Security Headers Checklist */
    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #283548;
      font-size: 12px;
    }
    .check-item:last-child {
      border-bottom: none;
    }
    .check-name {
      color: #cbd5e1;
    }
    .check-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .check-status.PASS {
      background: var(--success-bg);
      color: var(--success);
    }
    .check-status.WARN {
      background: var(--warning-bg);
      color: var(--warning);
    }

    /* Manual audit section */
    .input-group {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    input[type="text"] {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #ef4444;
    }

    button {
      background: #334155;
      color: #f8fafc;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    button:hover {
      background: #475569;
    }
    button.btn-primary {
      background: #dc2626;
    }
    button.btn-primary:hover {
      background: #b91c1c;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #334155;
      font-size: 11px;
      color: #cbd5e1;
    }

    .footer-note {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 10px;
    }

    .empty-state {
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Auto popup alert banner when triggered automatically -->
  <div id="auto-alert-notice" class="auto-alert-notice">
    🚨 <strong>【高危漏洞自動警報】</strong> 偵測到訪問網站存在紅色高危漏洞，已預設為您自動開啟此視窗提醒！
  </div>

  <header>
    <div class="brand">
      <span class="brand-icon">🛡️</span>
      <div>
        <h1>伺服器與後端漏洞檢測器</h1>
        <div class="header-sub">PHP / Node.js / Apache / Nginx / IIS / Tomcat</div>
      </div>
    </div>
    <span class="badge-ver">v2.2</span>
  </header>

  <!-- Current Target & Status -->
  <div class="card">
    <div class="url-row">
      <span id="target-url" class="url-text">正在偵測當前網頁...</span>
    </div>
    <div id="status-banner" class="status-banner NONE">
      <span id="status-icon">⏳</span>
      <span id="status-text">正在分析伺服器標頭與後端指紋...</span>
    </div>

    <!-- Detected Tech Stack -->
    <div style="margin-top: 10px;">
      <div style="font-size: 11px; color: var(--text-muted); font-weight: 600;">偵測到的後端與伺服器架構:</div>
      <div id="tech-chips-container" class="tech-chips">
        <span class="tech-chip">正在分析...</span>
      </div>
    </div>
  </div>

  <!-- Vulnerability List -->
  <div class="section-title">
    <span>重大近期漏洞分析 (CVE)</span>
    <span id="cve-count-chip" class="count-chip">0 個</span>
  </div>
  <div id="vulnerabilities-container">
    <div class="card empty-state">尚未發現受影響的 CVE 漏洞</div>
  </div>

  <!-- Security Headers Check -->
  <div class="section-title">
    <span>防禦標頭與資訊洩漏審查</span>
  </div>
  <div class="card">
    <div id="headers-check-container">
      <div class="empty-state">暫無標頭資料</div>
    </div>
  </div>

  <!-- Manual Target Audit -->
  <div class="section-title">
    <span>手動檢測任意目標 URL</span>
  </div>
  <div class="card">
    <div class="input-group">
      <input type="text" id="manual-url-input" placeholder="https://example.com" />
      <button id="btn-manual-audit" class="btn-primary">檢測</button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="btn-row">
    <button id="btn-rescan" style="flex: 1;">🔄 重新檢測當前頁面</button>
    <button id="btn-copy-report" style="flex: 1;">📋 複製安全審查報告</button>
  </div>

  <!-- Auto-popup setting toggle -->
  <div class="settings-row">
    <label for="toggle-auto-popup" style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <span>⚡ 網站有紅色高危漏洞時自動開啟彈出視窗</span>
    </label>
    <input type="checkbox" id="toggle-auto-popup" checked style="cursor: pointer; accent-color: #ef4444;" />
  </div>

  <div class="footer-note">
    本工具採用被動指紋比對與安全標頭審查，完全不發送攻擊載荷，供資安與開發人員防範注意。
  </div>

  <script src="cve_database.js"></script>
  <script src="popup.js"></script>
</body>
</html>
